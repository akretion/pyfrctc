[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "pyfrctc"
description = "Helpers for eInvoicing and eReporting in France"
authors = [{name = "Alexis de Lattre", email = "alexis.delattre@akretion.com"}]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Lesser General Public License v2 or later (LGPLv2+)",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
readme = "README.md"
license = {file = "LICENSE.txt"}
dependencies = [
  "requests",
  "requests_oauthlib",
  "python-stdnum >= 1.20",
  "lxml",
  "pytz",
  "python-dateutil",
  "dnspython>=2.0.0,<2.6.0; python_version < '3.10'",
  "dnspython>=2.6.0; python_version >= '3.10'",
  "importlib-resources ; python_version < '3.9'",
]
requires-python = ">=3.8"
dynamic = ["version"]

[project.optional-dependencies]
test = [
    "pytest",
    "coverage[toml]",
]

[project.urls]
Homepage = "https://github.com/akretion/pyfrctc"
Source = "https://github.com/akretion/pyfrctc"
Issues = "https://github.com/akretion/pyfrctc/issues"

[project.scripts]
pyfrctc-peppol_dir_line_check = "pyfrctc.scripts.peppol_dir_line_check:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build]
exclude = [
    "/.github",
]

[tool.hatch.envs.test]
features = [
    "test"
]

[tool.ruff]
target-version = "py39"
fix = true

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "UP",
    "W",
]
ignore = [
]
exclude = [
    "docs/conf.py",
]

[tool.ruff.lint.isort]
known-first-party = []


[tool.coverage.run]
branch = true
source_pkgs = ["pyfrctc"]

[tool.coverage.paths]
source = ["src", ".tox/*/site-packages"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
]



[tool.towncrier]
package = "pyfrctc"
package_dir = "src"
filename = "HISTORY.rst"
directory = "news"
issue_format = "`#{issue} <https://github.com/akretion/pyfrctc/issues/{issue}>`_"
title_format = "{version} ({project_date})"
